name: bot-bmvipd70t
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'bots/bmvipd70t/**'
      - '.github/workflows/bot-bmvipd70t.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-bmvipd70t
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: bots/bmvipd70t
        run: pip install -r requirements.txt
      - name: Run bot
        working-directory: bots/bmvipd70t
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN_BMVIPD70T }}
          GITHUB_TOKEN: ${{ github.token }}
        run: timeout 340m python bot.py || true
      - name: Restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot-bmvipd70t.yml --repo ${{ github.repository }}
